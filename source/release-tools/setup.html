<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Xin Music Setup</title><link rel="stylesheet" href="setup.css"></head><body>
<header><div><small>XIN MUSIC LAB</small><h1 data-zh="开始使用" data-en="Get started">开始使用</h1></div><button id="language">English</button></header>
<p class="intro" data-zh="先配置需要的功能。没有模型也能浏览曲库、播放音乐和使用可视化。" data-en="Configure only what you need. Library browsing, playback and visualization work without models."></p>
<section class="locations"><span data-zh="① 选择位置" data-en="1 · Choose locations"></span><button id="library" data-zh="音乐曲库…" data-en="Music library…"></button><button id="output" data-zh="生成文件目录…" data-en="Output directory…"></button><span id="locationStatus" role="status"></span></section>
<section><div class="section-head"><h2 data-zh="② 配置功能" data-en="2 · Configure features"></h2><span class="muted" data-zh="模型权重不随包提供" data-en="Model weights are not bundled"></span></div><div class="layout"><nav id="groups" aria-label="Backends"></nav><main><h2 id="title"></h2><p id="notice" class="muted"></p><div id="fields"></div><div id="links" class="actions"></div><div class="actions"><button id="probe" class="primary" data-zh="检查配置" data-en="Check setup"></button><button id="save" disabled data-zh="保存配置" data-en="Save setup"></button><button id="cancel" disabled data-zh="取消检查 / 安装" data-en="Cancel operation"></button></div><p id="status" role="status" aria-live="polite"></p><ul id="engines"></ul><div id="installCard"><strong data-zh="没有 Python？" data-en="No Python installed?"></strong><p class="muted" data-zh="可自动准备 MIDI 保存与导出环境，不含 AI 转谱模型。需要联网，预留 1 GB；点击后选择存放位置。" data-en="Install the environment for MIDI save/export automatically. No AI transcription models. Internet and 1 GB free space required; choose a storage folder after clicking."></p><button id="install" data-zh="安装 MIDI 基础环境…" data-en="Install MIDI environment…"></button></div></main></div></section>
<footer><p data-zh="③ 保存后关闭并重新打开 XLD / XML。模型检查只验证依赖和文件，音质仍需用短片段试听；MIDI 基础环境会执行读写验证。" data-en="3 · After saving, close and reopen XLD / XML. Model checks verify dependencies and files, not transcription quality. The MIDI environment check performs a read/write roundtrip."></p><div class="actions"><button id="export" data-zh="导出脱敏诊断…" data-en="Export redacted diagnostics…"></button><span class="muted" data-zh="其余 AI 环境仍按随包 MODEL-SETUP.md 安装，可在此导入。" data-en="Install other AI environments using MODEL-SETUP.md, then import them here."></span></div><details><summary data-zh="安装记录" data-en="Installation log"></summary><pre id="log"></pre></details></footer><script src="setup.js"></script></body></html>
